client_max_body_size 20M;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/wasm font/woff2 image/svg+xml;

upstream backend {
    server {{ .Env.URL_BACKEND }};
}

server {
    listen 80;
    index index.html;
    root /var/www/public/;

    {{ if .Env.FRONTEND_SERVER_NAME }}
    server_name {{ .Env.FRONTEND_SERVER_NAME }};
    {{else}}
    server_name _;
    {{end}}

    include sites.d/frontend.conf;
    include include.d/letsencrypt.conf;
}

{{if .Env.BACKEND_SERVER_NAME}}
server {
    server_name {{ .Env.BACKEND_SERVER_NAME }};
    include sites.d/backend.conf;
    include include.d/letsencrypt.conf;
}
{{end}}